<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的vivo手机网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "微软雅黑", Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1976d2;
            text-align: center;
            margin-bottom: 25px;
        }
        .content p {
            line-height: 1.8;
            color: #333;
            margin: 12px 0;
            font-size: 16px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            margin: 20px 0;
            display: block;
        }
        .video-container {
            margin: 30px 0;
            text-align: center;
        }
        iframe {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>你好！这是我用vivo手机搭建的网站</h1>
        <div class="content">
            <p>大家好！我用vivo S1手机搭建了这个个人网站</p>
            <p>个人介绍：这里可以写你自己的简介</p>

            <!-- 第一张图片 -->
            <img src="1photo.jpg.jpg" alt="西装男士">
            <p>这是第一张图片：西装男士</p>

            <!-- 第二张图片 -->
            <img src="2photo.jpg.jpg" alt="卡通小猴">
            <p>这是第二张图片：卡通小猴</p>

            <!-- 第三张图片 -->
            <img src="3photo.jpg.png" alt="古风美女">
            <p>这是第三张图片：古风美女</p>

            <!-- B站视频 -->
            <div class="video-container">
                <p>下面是我的最新视频，欢迎围观！</p>
                <iframe 
                    src="https://player.bilibili.com/player.html?bvid=BV1Fm4m18Fq" 
                    width="95%" 
                    height="480" 
                    frameborder="0" 
                    allowfullscreen>
                </iframe>
            </div>

            <p>搭建时间：2026年5月</p>
        </div>
    </div>
</body>
</html>
